{% extends 'base.html' %}

{% block content %}
<div class="col-md-8 col-lg-6 fade-in">
    <div class="glass-card p-5 text-center position-relative overflow-hidden">
        
        <div class="position-absolute top-0 start-50 translate-middle" style="margin-top: -20px;">
            <div class="bg-success rounded-circle opacity-25" style="width: 150px; height: 150px; filter: blur(30px);"></div>
        </div>

        <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        </div>

        <h3 class="fw-bold text-secondary mb-1">Estimated House Price</h3>
        <p class="text-muted small">Based on our AI Model calculation</p>

        <h1 class="display-4 fw-bold text-primary my-4" id="priceDisplay" data-price="{{ price }}">
            Loading...
        </h1>

        <div class="alert alert-light border border-light-subtle shadow-sm d-inline-block px-4 py-2 rounded-pill">
            <i class="bi bi-info-circle me-1 text-info"></i>
            Prediction accuracy may vary depending on specific locations.
        </div>

        <div class="mt-5 d-flex justify-content-center gap-3">
            <a href="{{ url_for('predict') }}" class="btn btn-outline-primary rounded-pill px-4">
                <i class="bi bi-arrow-repeat me-2"></i>Try Again
            </a>
            <a href="{{ url_for('home') }}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house me-2"></i>Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
